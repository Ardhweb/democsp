<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>{% block title %}portal-Cspdemo{% endblock title %}</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
      {% include "partials/style.html" %}
      
      /* Optional but highly recommended helper to cleanly switch visibility of loading components */
      .htmx-indicator {
          display: none;
      }
      .htmx-request.htmx-indicator, .htmx-request .htmx-indicator {
          display: block;
      }
    </style>
  </head>
  <body>

{% if request.META.HTTP_HX_REQUEST %}

   
    
    {% block content %}{% endblock content %}

{% else %}

    {% with dynamic_layout=layout_style|default:"layouts/dashboard_layout.html" %}
        {% include dynamic_layout %}
    {% endwith %}

{% endif %}

<script>
    // 1. Load saved sidebar state IMMEDIATELY to prevent visual flashing
    if (localStorage.getItem("sidebar-state") === "collapsed") {
        document.body.classList.add("sidebar-collapsed");
    }

    // 2. Initialize Sidebar Toggle Engine
    function initSidebar() {
        const sidebarToggle = document.getElementById("sidebar-toggle");
        const body = document.body;
        const navLinks = document.querySelectorAll("#sidebar .nav-link");

        // Clean up any old listeners before attaching new ones (prevents memory leaks)
        if (sidebarToggle) {
            sidebarToggle.replaceWith(sidebarToggle.cloneNode(true));
            const freshToggle = document.getElementById("sidebar-toggle");
            
            freshToggle.addEventListener("click", function () {
                body.classList.toggle("sidebar-collapsed");
                if (body.classList.contains("sidebar-collapsed")) {
                    localStorage.setItem("sidebar-state", "collapsed");
                } else {
                    localStorage.setItem("sidebar-state", "expanded");
                }
            });
        }

        // Active Link Highlighting Tracker
        navLinks.forEach(link => {
            link.addEventListener("click", function () {
                navLinks.forEach(item => item.classList.remove("active"));
                this.classList.add("active");
            });
        });
    }

    document.addEventListener("DOMContentLoaded", initSidebar);
    document.body.addEventListener("htmx:afterOnLoad", initSidebar);
 document.body.addEventListener('htmx:afterSwap', function(evt) {
    sessionStorage.setItem('cached-page-content', document.body.innerHTML);
  });

    
</script>

<script src="{% static '/js/sweetalert2.js' %}"></script>

<button onclick="testAlert()" class="btn btn-primary">
    Test SweetAlert
</button>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
